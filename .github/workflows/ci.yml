name: CI

on:
  push:
  pull_request:

jobs:
  secrets:
    # keys, passwords and connection strings must never be committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-secrets.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:                       # the storage tests also run against Postgres, as on Neon
        image: postgres:16
        env:
          POSTGRES_USER: doosra
          POSTGRES_PASSWORD: doosra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doosra" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,cloud]"
      - run: python -m pytest -q
        env:
          DOOSRA_DB: ${{ runner.temp }}/ci.sqlite
          DOOSRA_MODELS_DIR: ${{ runner.temp }}/models
          DOOSRA_TEST_PG_URL: postgresql://doosra:doosra@localhost:5432/postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
